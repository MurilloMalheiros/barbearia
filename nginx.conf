worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json;

    # Rate limiting para área admin
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;

    server {
        listen 80;
        server_name seudominio.com.br www.seudominio.com.br;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name seudominio.com.br www.seudominio.com.br;

        root /var/www/barbearia/public;
        index index.php;

        ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Arquivos sensíveis
        location ~* \.(env|sql|log|lock|md|json|gitignore)$ { deny all; }

        # Rate limiting admin
        location /admin {
            limit_req zone=admin burst=20 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Uploads: apenas arquivos estáticos, sem PHP
        location /uploads/ {
            alias /var/www/barbearia/public/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            location ~* \.php$ { deny all; }
        }

        # Assets
        location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        }

        # Headers de segurança
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
}
